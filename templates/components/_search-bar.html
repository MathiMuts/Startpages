<form method="GET" action="https://www.google.com/search" class="w-full max-w-xl mx-auto group">

    <!-- Uses .card-surface so the search bar matches the active card style + colour theme.
         The data-card-style wrapper is provided by the including page. -->
    <div class="card-surface relative flex items-center transition-shadow focus-within:ring-2 focus-within:ring-primary-500/40">
        <!-- Input Field -->
        <input
            type="search"
            name="as_q"
            placeholder="Search the web..."
            autofocus=""
            autocomplete="off"
            aria-label="Search"
            class="w-full pl-6 pr-14 py-4
            bg-transparent border-0 outline-none
            text-secondary-900 dark:text-white text-lg
            placeholder:text-secondary-400 dark:placeholder:text-secondary-500
            focus:ring-0"
        >

        <!-- Search Button -->
        <button type="submit"
                class="cursor-pointer absolute right-2 top-1/2 -translate-y-1/2 p-2.5 rounded-xl
                       text-primary-500 dark:text-primary-400
                       hover:text-primary-600 dark:hover:text-primary-300
                       transition-all duration-200">
            <span class="sr-only">Search</span>
            <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
            </svg>
        </button>
    </div>
</form>
